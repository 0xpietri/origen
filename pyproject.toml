[project]
name = "origen"
version = "0.1.0"
description = "origen.pietri.dev: the real sky, computed with serious tools. Astronomy and astrology were born sisters. They will be again."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pandas>=3.1.1",
    "skyfield>=1.49",
    "uvicorn>=0.35",
]

[project.scripts]
origen = "origen.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "jsonschema>=4.26.0",
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.12",
]
# Research only: notebooks in research/. Never installed in the image, never imported by src/.
research = [
    "astropy>=7.0",
    "astroquery>=0.4.10",
    "jupyterlab>=4.4",
    "scipy>=1.15",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/origen"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Astronomy writes its symbols: α, δ, ′, ″, ×, −.
allowed-confusables = ["α", "δ", "′", "″", "×", "−"]

[tool.mypy]
python_version = "3.12"
packages = ["origen"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["skyfield.*", "jplephem.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
